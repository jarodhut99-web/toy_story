<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Especial: Toy Story 5 🚀</title>
  
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Fredoka:wght@700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
      position: relative;
      background-color: #3b9cdc;
    }

    /* --- DISEÑO DEL FONDO OPTIMIZADO PARA PC Y MÓVILES --- */
    .sky-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('fondo.jpg');
      background-size: cover;
      background-position: center center;
      z-index: 1;
    }

    /* Ajuste especial para que la imagen se encoja y no corte a los personajes en pantallas de celular vertical */
    @media (max-width: 768px) and (orientation: portrait) {
      .sky-background {
        background-size: contain; /* Encoge la imagen para que entren Woody y Buzz a los lados */
        background-repeat: no-repeat;
        background-position: center center;
        background-color: #3b9cdc; /* Rellena con el color exacto del cielo si sobra espacio arriba o abajo */
      }
    }

    /* --- PANTALLA RECIBIDORA PARA DESBLOQUEAR EL AUDIO --- */
    .audio-unlocker {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #3b9cdc;
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .unlock-btn {
      background: #fecb05;
      border: 6px solid #00377a;
      border-radius: 50%;
      width: 120px;
      height: 120px;
      font-size: 50px;
      cursor: pointer;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
      animation: pulse 1.5s infinite;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .unlock-text {
      font-family: 'Fredoka', cursive;
      color: white;
      margin-top: 20px;
      font-size: 1.5rem;
      text-shadow: 2px 2px 0px #00377a;
      text-align: center;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(254, 203, 5, 0.7); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 15px rgba(254, 203, 5, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(254, 203, 5, 0); }
    }

    /* --- TARJETA CENTRAL EN RESPONSIVE --- */
    .card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(5px);
      padding: 45px 35px;
      border-radius: 30px;
      text-align: center;
      width: 90%;
      max-width: 440px;
      z-index: 10;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      border: 8px solid #fecb05; 
      outline: 4px solid #00377a; 
      position: relative;
      opacity: 0;
      transform: scale(0.8);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
    }

    /* Ajuste fino para celulares: reduce el tamaño del cuadro para que no tape por completo a Woody y Buzz */
    @media (max-width: 480px) {
      .card {
        padding: 25px 20px;
        max-width: 320px; /* Se hace más angosta para dejar espacio visual a los lados */
      }
      .titulo {
        font-size: 1.4rem !important;
      }
      .toy-style {
        font-size: 1.9rem !important;
      }
      button {
        padding: 12px 20px !important;
        font-size: 1rem !important;
      }
    }

    .card.show {
      opacity: 1;
      transform: scale(1);
    }

    .woody-badge {
      position: absolute;
      top: -24px;
      left: calc(50% - 25px);
      background: #fecb05;
      font-size: 28px;
      width: 50px;
      height: 50px;
      line-height: 44px;
      border-radius: 50%;
      border: 3px solid #00377a;
      box-shadow: 0 5px 10px rgba(0,0,0,0.15);
    }

    .titulo {
      font-family: 'Fredoka', cursive;
      color: #00377a;
      font-size: 1.9rem;
      line-height: 1.3;
      margin-top: 5px;
    }

    .toy-style {
      display: block;
      font-size: 2.5rem;
      color: #e51b24; 
      text-shadow: 3px 3px 0px #fecb05, -1px -1px 0px #00377a, 1px -1px 0px #00377a, -1px 1px 0px #00377a, -1px 1px 0px #00377a;
      transform: rotate(-2deg);
      margin: 10px 0;
    }

    .subtitulo {
      color: #444;
      font-size: 1.1rem;
      margin: 25px 0;
      font-style: italic;
      font-weight: bold;
    }

    .buttons-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      height: 80px;
      position: relative;
    }

    button {
      font-family: 'Fredoka', cursive;
      padding: 15px 30px;
      font-size: 1.2rem;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 6px 0px rgba(0,0,0,0.15);
      transition: transform 0.2s ease, opacity 0.2s ease;
      text-decoration: none;
    }

    #btn-si {
      background-color: #78c043; 
      color: white;
      border: 3px solid #9c4ae3; 
      z-index: 30; 
      position: relative;
    }

    #btn-no {
      background-color: #e51b24; 
      color: white;
      border: 3px solid #b11319;
      z-index: 20;
    }
  </style>
</head>
<body>

  <div class="audio-unlocker" id="bloqueo-audio" onclick="entrarInvitacion()">
    <button class="unlock-btn">🚀</button>
    <div class="unlock-text">Tienes una invitación especial...<br>¡Toca para abrir!</div>
  </div>

  <div class="sky-background"></div>

  <div class="card" id="tarjeta-invitacion">
    <div class="woody-badge">⭐</div>
    <h1 class="titulo">¿Quieres ir a ver <span class="toy-style">Toy Story 5</span> el 26 de Junio al cine conmigo?</h1>
    <p class="subtitulo">¡Al infinito y más allá!</p>
    
    <div class="buttons-container">
      <button id="btn-si" onclick="abrirWhatsApp()">¡SÍ, CLARO! 🚀</button>
      <button id="btn-no">No 😢</button>
    </div>
  </div>

  <audio id="musica-toy" loop preload="auto">
    <source id="fuente-audio" src="Yo_Soy_Tu_Amigo_Fiel.mp3" type="audio/mpeg">
  </audio>

  <script>
    const btnNo = document.getElementById('btn-no');
    const tarjeta = document.getElementById('tarjeta-invitacion');
    const pantallaBloqueo = document.getElementById('bloqueo-audio');
    const musica = document.getElementById('musica-toy');
    const fuenteAudio = document.getElementById('fuente-audio');
    let musicaIniciada = false;

    function entrarInvitacion() {
      if (!musicaIniciada) {
        fuenteAudio.src = "Yo_Soy_Tu_Amigo_Fiel.mp3?v=" + new Date().getTime();
        musica.load();
        
        musica.play()
          .then(() => { musicaIniciada = true; })
          .catch((e) => console.log("Audio bloqueado:", e));
      }

      pantallaBloqueo.style.opacity = "0";
      pantallaBloqueo.style.visibility = "hidden";
      tarjeta.classList.add("show");
    }

    btnNo.addEventListener('mouseenter', () => {
      btnNo.style.transform = 'scale(0)';
      btnNo.style.opacity = '0';
      btnNo.style.pointerEvents = 'none';
    });

    btnNo.addEventListener('touchstart', (e) => {
      e.preventDefault();
      btnNo.style.transform = 'scale(0)';
      btnNo.style.opacity = '0';
      btnNo.style.pointerEvents = 'none';
    });

    tarjeta.addEventListener('mouseleave', () => {
      btnNo.style.transform = 'scale(1)';
      btnNo.style.opacity = '1';
      btnNo.style.pointerEvents = 'auto';
    });

    function abrirWhatsApp() {
      const numero = "50661547634";
      const mensaje = encodeURIComponent("¡Sí, quiero ir contigo al cine a ver Toy Story 5! 🚀🤠🎬");
      
      const deepLink = `whatsapp://send?phone=${numero}&text=${mensaje}`;
      const webLink = `https://whatsapp.com{numero}&text=${mensaje}`;
      
      window.location.href = deepLink;
      
      setTimeout(() => {
        window.open(webLink, '_blank');
      }, 250);
    }
  </script>
</body>
</html>
