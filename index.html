<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación Especial: Toy Story 5 🚀</title>
  
  <!-- Tipografías de película -->
  <link href="https://googleapis.com" rel="stylesheet">
  
  <!-- Librería para lanzar confeti al aceptar -->
  <script src="https://jsdelivr.net"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
      position: relative;
      background-color: #3b9cdc;
    }

    /* --- TU IMAGEN LOCAL DE WOODY Y BUZZ --- */
    .sky-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('fondo.jpg');
      background-size: cover;
      background-position: center;
      z-index: 1;
    }

    /* --- Tarjeta del Centro --- */
    .card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(5px);
      padding: 45px 35px;
      border-radius: 30px;
      text-align: center;
      width: 90%;
      max-width: 440px;
      z-index: 10;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      border: 8px solid #fecb05; /* Amarillo Woody */
      outline: 4px solid #00377a; /* Azul Buzz */
      position: relative;
    }

    .woody-badge {
      position: absolute;
      top: -24px;
      left: calc(50% - 25px);
      background: #fecb05;
      font-size: 28px;
      width: 50px;
      height: 50px;
      line-height: 44px;
      border-radius: 50%;
      border: 3px solid #00377a;
      box-shadow: 0 5px 10px rgba(0,0,0,0.15);
    }

    .titulo {
      font-family: 'Fredoka One', cursive;
      color: #00377a;
      font-size: 1.9rem;
      line-height: 1.3;
      margin-top: 5px;
    }

    .toy-style {
      display: block;
      font-size: 2.5rem;
      color: #e51b24; /* Rojo Pixar */
      text-shadow: 3px 3px 0px #fecb05, -1px -1px 0px #00377a, 1px -1px 0px #00377a, -1px 1px 0px #00377a, 1px 1px 0px #00377a;
      transform: rotate(-2deg);
      margin: 10px 0;
    }

    .subtitulo {
      color: #444;
      font-size: 1.1rem;
      margin: 25px 0;
      font-style: italic;
      font-weight: bold;
    }

    /* --- Contenedor de Botones --- */
    .buttons-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      height: 80px;
      position: relative;
    }

    button {
      font-family: 'Fredoka One', cursive;
      padding: 15px 30px;
      font-size: 1.2rem;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 6px 0px rgba(0,0,0,0.15);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
    }

    #btn-si {
      background-color: #78c043; /* Verde Buzz */
      color: white;
      border: 3px solid #9c4ae3; /* Morado Buzz */
      z-index: 20;
    }

    #btn-no {
      background-color: #e51b24; /* Rojo peligro */
      color: white;
      border: 3px solid #b11319;
      transform-origin: center;
    }
  </style>
</head>
<body>

  <div class="sky-background"></div>

  <div class="card">
    <div class="woody-badge">⭐</div>
    <!-- Nueva pregunta con la fecha solicitada -->
    <h1 class="titulo">¿Quieres ir a ver <span class="toy-style">Toy Story 5</span> el 26 de Junio conmigo al cine?</h1>
    <p class="subtitulo">¡Al infinito y más allá!</p>
    
    <div class="buttons-container">
      <button id="btn-si" onclick="aceptarInvitacion()">¡SÍ, CLARO! 🚀</button>
      <button id="btn-no">No 😢</button>
    </div>
  </div>

  <audio id="musica-toy" loop>
    <source src="https://soundhelix.com" type="audio/mpeg">
  </audio>

  <script>
    const btnNo = document.getElementById('btn-no');
    const btnSi = document.getElementById('btn-si');
    const musica = document.getElementById('musica-toy');
    let musicaIniciada = false;

    function encenderMusica() {
      if (!musicaIniciada) {
        musica.play().catch(() => console.log("Audio activo"));
        musicaIniciada = true;
      }
    }

    btnNo.addEventListener('mouseenter', () => {
      encenderMusica();
      btnNo.style.transform = 'scale(0)';
      btnNo.style.opacity = '0';
      btnNo.style.pointerEvents = 'none';
      btnSi.style.transform = 'scale(1.3)';
    });

    document.querySelector('.card').addEventListener('mouseleave', () => {
      btnNo.style.transform = 'scale(1)';
      btnNo.style.opacity = '1';
      btnNo.style.pointerEvents = 'auto';
      btnSi.style.transform = 'scale(1)';
    });

    function aceptarInvitacion() {
      encenderMusica();
      
      // 1. Lanza la ráfaga de confeti con colores de Toy Story
      confetti({
        particleCount: 150,
        spread: 85,
        origin: { y: 0.6 },
        colors: ['#fecb05', '#e51b24', '#78c043', '#9c4ae3', '#00377a']
      });

      // 2. Espera medio segundo para que disfrute el confeti y abre WhatsApp con el mensaje personalizado
      setTimeout(() => {
        const telefono = "50661547634";
        const mensaje = encodeURIComponent("¡Sí, quiero ir contigo! 🚀🤠🎬");
        
        // Abre WhatsApp Web en PC o la app nativa si está en un celular
        window.open(`https://whatsapp.com{telefono}&text=${mensaje}`, '_blank');
      }, 600);
    }
  </script>
</body>
</html>
